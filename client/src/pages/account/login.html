<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login de Usuário</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>
    <link rel="stylesheet" href="../../styles/base.css" />
    <link id="theme-css" rel="stylesheet" href="../../styles/light.css" />
    <script type="module" src="../../scripts/account/login.js" defer></script>
  </head>
  <body class="d-flex flex-column">
    <header class="bg-white border-bottom shadow-sm">
      <div class="container d-flex align-items-center gap-3 py-3">
        <a
          href="/client/index.html"
          class="btn btn-outline-secondary"
          aria-label="Voltar para a página inicial"
        >
          <i class="bi bi-arrow-left"></i>
        </a>

        <h1 class="h4 mb-0">NeoBov - Login de Usuário</h1>
      </div>
    </header>
    <main
      class="d-flex justify-content-center align-items-center flex-grow-1 mt-2 mb-2"
    >
      <!-- TODO: mover o max-width para uma classe CSS (ex.: .login-card) -->
      <div class="card shadow p-5 w-100" style="max-width: 450px">
        <form method="post" class="vstack gap-4">
          <fieldset>
            <legend class="text-center fs-2 fw-semibold mb-4">
              Dados de Login
            </legend>

            <div class="mb-3">
              <label for="email" class="form-label"
                >Email <span class="text-danger">*</span></label
              >
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="nome@email.com"
                autocomplete="email"
                required
              />
            </div>

            <!--
          Adicionar as seguintes funcionalidades as senhas:
          - "Olho" de toggle na visibilidade da senha
          - Opção "Esqueceu a senha?" (Talvez)
           -->
            <div class="mb-3">
              <label for="password" class="form-label"
                >Senha <span class="text-danger">*</span></label
              >
              <div class="position-relative">
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  placeholder="********"
                  minlength="8"
                  autocomplete="current-password"
                  required
                />
                <button
                  type="button"
                  id="toggle-password"
                  class="btn position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent me-2 p-0"
                  aria-label="Mostrar senha"
                >
                  <i class="bi bi-eye-fill"></i>
                </button>
              </div>
            </div>

            <div class="form-check">
              <input
                class="form-check-input"
                type="checkbox"
                id="remember"
                name="remember"
                value="true"
              />

              <label class="form-check-label" for="remember">
                Lembrar-me
              </label>
            </div>
            <!--Opção "Lembrar-me": Fazer funcionar com o backend -->
          </fieldset>

          <button type="submit" class="btn btn-success w-100 py-2">
            Entrar
          </button>
          <div class="small">
            <p class="mb-0">
              Não possui uma conta?
              <a href="./register.html">Cadastre-se</a>
            </p>
          </div>
        </form>
      </div>
    </main>
    <footer class="bg-white border-top py-3 mt-auto">
      <div class="container text-center">
        <small class="text-muted">
          &copy; 2026 Vinícius Saraiva. Todos os direitos reservados.
        </small>
      </div>
    </footer>
  </body>
</html>
