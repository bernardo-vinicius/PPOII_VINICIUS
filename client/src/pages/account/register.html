<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Usuário</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>
    <link rel="stylesheet" href="../../styles/base.css" />
    <link rel="stylesheet" href="../../styles/light.css" />
    <link rel="stylesheet" href="../../styles/dark.css" />
    <script src="../../scripts/utils/theme.js" defer></script>
    <script
      type="module"
      src="../../scripts/account/register.js"
      defer
    ></script>
  </head>
  <body class="d-flex flex-column">
    <header class="border-bottom shadow-sm">
      <div class="container d-flex align-items-center gap-3 py-3">
        <a
          href="../../../index.html"
          class="btn btn-outline-secondary"
          aria-label="Voltar para a página inicial"
        >
          <i class="bi bi-arrow-left"></i>
        </a>

        <h1 class="h4 mb-0">NeoBov - Cadastro de Usuário</h1>

        <button
          id="toggle-theme"
          class="btn btn-outline-secondary ms-auto"
          type="button"
          aria-label="Alternar tema"
        >
          <i class="bi bi-moon-stars-fill"></i>
        </button>
      </div>
    </header>
    <main
      class="d-flex justify-content-center align-items-center flex-grow-1 mt-2 mb-2"
    >
      <div class="card shadow p-5 w-100 login-card">
        <form method="post" class="vstack gap-4">
          <fieldset>
            <legend class="text-center fs-2 fw-semibold mb-4">
              Dados de Cadastro
            </legend>

            <div class="mb-3">
              <label for="username" class="form-label"
                >Nome de Usuário <span class="text-danger">*</span></label
              >
              <input
                type="text"
                class="form-control"
                id="username"
                name="username"
                autocomplete="username"
                placeholder="Nome"
                required
              />
            </div>

            <div class="mb-3">
              <label for="email" class="form-label"
                >E-mail <span class="text-danger">*</span></label
              >
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                autocomplete="email"
                placeholder="nome@email.com"
                required
              />
            </div>

            <!-- Validar se a senha é segura no JS -->
            <div class="mb-3">
              <label for="password" class="form-label"
                >Senha <span class="text-danger">*</span></label
              >
              <div class="position-relative">
                <input
                  type="password"
                  class="form-control"
                  id="password"
                  name="password"
                  placeholder="********"
                  minlength="8"
                  autocomplete="new-password"
                  required
                />
                <button
                  type="button"
                  id="toggle-password"
                  class="btn position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent me-2 p-0"
                  aria-label="Mostrar senha"
                >
                  <i class="bi bi-eye"></i>
                </button>
              </div>
              <div class="form-text">
                (Mínimo 8 caracteres, 1 símbolo, 1 número, 1 letra maiúscula e 1
                letra minúscula)
              </div>
            </div>

            <!-- Verificar no JS se este campo é igual ao de senha -->
            <div class="mb-3">
              <label for="confirm-password" class="form-label"
                >Confirmar Senha <span class="text-danger">*</span></label
              >
              <div class="position-relative">
                <input
                  type="password"
                  class="form-control"
                  id="confirm-password"
                  name="confirm-password"
                  placeholder="********"
                  minlength="8"
                  autocomplete="new-password"
                  required
                />
                <button
                  type="button"
                  id="toggle-confirm-password"
                  class="btn position-absolute top-50 end-0 translate-middle-y border-0 bg-transparent me-2 p-0"
                  aria-label="Mostrar confirmação da senha"
                >
                  <i class="bi bi-eye"></i>
                </button>
              </div>
            </div>
          </fieldset>

          <!-- Seção de Endereço de Usuário removidada (ao menos temporariamente)  -->

          <button
            id="submit-btn"
            type="submit"
            class="btn btn-success w-100 py-2"
          >
            Cadastre-se
          </button>
          <div class="small">
            <p class="mb-0">
              Já possui uma conta? <a href="./login.html">Faça login</a>
            </p>
          </div>
        </form>
      </div>
    </main>
    <footer class="border-top py-3 mt-auto">
      <div class="container text-center">
        <small class="text-muted">
          &copy; 2026 Vinícius Saraiva. Todos os direitos reservados.
        </small>
      </div>
    </footer>
  </body>
</html>
