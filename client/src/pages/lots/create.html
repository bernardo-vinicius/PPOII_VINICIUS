<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Lote</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <a href="../account/control.html">Voltar ao Painel de Controle</a>
      <h1>Cadastrar Lote</h1>
    </header>
    <main>
      <form method="post">
        <fieldset>
          <legend>Propriedade Vinculada</legend>

          <label for="property">Propriedade: *</label>
          <select name="property" id="property" required>
            <option value="" selected disabled>Selecione</option>

            <!-- Valores 'option' provenientes do backend (tabela propriedades) -->
            <option value="teste">*Propriedade Teste</option>
          </select>
          <small>
            Propriedade não encontrada?
            <a href="../properties/create.html"
              >Cadastre uma nova propriedade</a
            >
          </small>
        </fieldset>

        <fieldset>
          <legend>Identificação do Lote</legend>

          <label for="name">Nome: *</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Lote A"
            required
          />

          <label for="area">Área Total (Hectares): *</label>
          <input type="text" id="area" name="area" placeholder="40" required />

          <label for="capacity">Capacidade de Animais: *</label>
          <input
            type="number"
            id="capacity"
            name="capacity"
            placeholder="10"
            min="1"
            required
          />

          <label for="purpose">Finalidade:</label>
          <select name="purpose" id="purpose" required>
            <option value="" selected disabled>Selecione</option>

            <option value="corte">Corte</option>
            <option value="leite">Leite</option>
            <option value="reproducao">Reprodução</option>
            <option value="recria">Recria</option>
            <option value="engorda">Engorda / Confinamento</option>
            <option value="misto">Misto</option>
          </select>
        </fieldset>

        <button type="submit">Cadastrar Propriedade</button>
        <button type="reset">Cancelar</button>
      </form>
    </main>
  </body>
</html>
