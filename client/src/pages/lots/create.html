<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Lote</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>
    <link rel="stylesheet" href="../../styles/base.css" />
    <link id="theme-css" rel="stylesheet" href="../../styles/light.css" />
  </head>

  <body class="d-flex flex-column">
    <header class="bg-white border-bottom shadow-sm">
      <div class="container d-flex align-items-center gap-3 py-3">
        <a
          href="../account/control.html"
          class="btn btn-outline-secondary"
          aria-label="Voltar ao painel de controle"
        >
          <i class="bi bi-arrow-left"></i>
        </a>

        <h1 class="h4 mb-0">NeoBov - Cadastro de Lote</h1>
      </div>
    </header>

    <main
      class="d-flex justify-content-center align-items-center flex-grow-1 my-3"
    >
      <!-- TODO: mover o max-width para uma classe CSS -->
      <div class="card shadow p-5 w-100" style="max-width: 700px">
        <form method="post" class="vstack gap-4">
          <fieldset>
            <legend class="fs-4 fw-semibold mb-3">Propriedade Vinculada</legend>

            <div class="mb-3">
              <label for="property" class="form-label">
                Propriedade <span class="text-danger">*</span>
              </label>

              <select
                class="form-select"
                id="property"
                name="property"
                required
              >
                <option value="" selected disabled>Selecione</option>

                <!-- Valores provenientes do backend -->
                <option value="teste">Propriedade Teste</option>
              </select>

              <div class="form-text">
                Propriedade não encontrada?
                <a href="../properties/create.html">
                  Cadastre uma nova propriedade
                </a>
              </div>
            </div>
          </fieldset>

          <fieldset>
            <legend class="fs-4 fw-semibold mb-3">Identificação do Lote</legend>

            <div class="row g-3">
              <div class="col-md-6">
                <label for="name" class="form-label">
                  Nome <span class="text-danger">*</span>
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="name"
                  name="name"
                  placeholder="Lote A"
                  required
                />
              </div>

              <div class="col-md-6">
                <label for="area" class="form-label">
                  Área Total (hectares)
                  <span class="text-danger">*</span>
                </label>

                <input
                  type="number"
                  class="form-control"
                  id="area"
                  name="area"
                  min="0"
                  step="0.01"
                  placeholder="40"
                  required
                />
              </div>

              <div class="col-md-6">
                <label for="capacity" class="form-label">
                  Capacidade de Animais
                  <span class="text-danger">*</span>
                </label>

                <input
                  type="number"
                  class="form-control"
                  id="capacity"
                  name="capacity"
                  min="1"
                  placeholder="10"
                  required
                />
              </div>

              <div class="col-md-6">
                <label for="purpose" class="form-label">
                  Finalidade
                  <span class="text-danger">*</span>
                </label>

                <select
                  class="form-select"
                  id="purpose"
                  name="purpose"
                  required
                >
                  <option value="" selected disabled>Selecione</option>

                  <option value="corte">Corte</option>
                  <option value="leite">Leite</option>
                  <option value="reproducao">Reprodução</option>
                  <option value="recria">Recria</option>
                  <option value="engorda">Engorda / Confinamento</option>
                  <option value="misto">Misto</option>
                </select>
              </div>
            </div>
          </fieldset>

          <button type="submit" class="btn btn-success py-2">
            Cadastrar Lote
          </button>
        </form>
      </div>
    </main>

    <footer class="bg-white border-top py-3 mt-auto">
      <div class="container text-center">
        <small class="text-muted">
          &copy; 2026 Vinícius Saraiva. Todos os direitos reservados.
        </small>
      </div>
    </footer>
  </body>
</html>
