<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Propriedade</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
      defer
    ></script>
    <link rel="stylesheet" href="../../styles/base.css" />
    <link rel="stylesheet" href="../../styles/light.css" />
    <link rel="stylesheet" href="../../styles/dark.css" />
    <script src="../../scripts/utils/theme.js" defer></script>
  </head>
  <body class="d-flex flex-column">
    <header class="border-bottom shadow-sm">
      <div class="container d-flex align-items-center gap-3 py-3">
        <a
          href="../account/control.html"
          class="btn btn-outline-secondary"
          aria-label="Voltar ao painel de controle"
        >
          <i class="bi bi-arrow-left"></i>
        </a>

        <h1 class="h4 mb-0">NeoBov - Cadastro de Propriedade</h1>

        <button
          id="toggle-theme"
          class="btn btn-outline-secondary ms-auto"
          type="button"
          aria-label="Alternar tema"
        >
          <i class="bi bi-moon-stars-fill"></i>
        </button>
      </div>
    </header>

    <main
      class="d-flex justify-content-center align-items-center flex-grow-1 my-3"
    >
      <div class="card shadow p-5 w-100 page-card">
        <form method="post" class="vstack gap-4">
          <fieldset>
            <legend class="fs-4 fw-semibold mb-3">
              Identificação da Propriedade
            </legend>

            <div class="mb-3">
              <label for="name" class="form-label">
                Nome <span class="text-danger">*</span>
              </label>
              <input
                type="text"
                class="form-control"
                id="name"
                name="name"
                placeholder="Fazenda Santa Rosa"
                required
              />
            </div>

            <div class="mb-3">
              <label for="area" class="form-label">
                Área Total (hectares)
                <span class="text-danger">*</span>
              </label>
              <input
                type="number"
                class="form-control"
                id="area"
                name="area"
                step="0.01"
                min="0"
                placeholder="320.5"
                required
              />
            </div>

            <div class="mb-3">
              <label for="description" class="form-label"> Descrição </label>
              <input
                type="text"
                class="form-control"
                id="description"
                name="description"
                placeholder="Fazenda Principal"
              />
            </div>
          </fieldset>

          <fieldset>
            <legend class="fs-4 fw-semibold">Localização</legend>

            <div class="row g-3">
              <div class="col-12">
                <label for="street" class="form-label">
                  Logradouro <span class="text-danger">*</span>
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="street"
                  name="street"
                  placeholder="Rua Joaquim Garcia"
                  required
                />
              </div>

              <div class="col-md-4">
                <label for="number" class="form-label"> Número </label>

                <input
                  type="number"
                  class="form-control"
                  id="number"
                  name="number"
                  min="1"
                  placeholder="230"
                />
              </div>

              <div class="col-md-8">
                <label for="complement" class="form-label"> Complemento </label>

                <input
                  type="text"
                  class="form-control"
                  id="complement"
                  name="complement"
                  placeholder="Perto do IFC"
                />
              </div>

              <div class="col-md-4">
                <label for="cep" class="form-label">
                  CEP <span class="text-danger">*</span>
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="cep"
                  name="cep"
                  placeholder="00000-000"
                  pattern="[0-9]{5}-[0-9]{3}"
                  maxlength="9"
                  required
                />
              </div>

              <div class="col-md-5">
                <label for="city" class="form-label">
                  Cidade <span class="text-danger">*</span>
                </label>

                <input
                  type="text"
                  class="form-control"
                  id="city"
                  name="city"
                  placeholder="Camboriú"
                  required
                />
              </div>

              <div class="col-md-3">
                <label for="state" class="form-label">
                  Estado <span class="text-danger">*</span>
                </label>

                <select class="form-select" id="state" name="state" required>
                  <option value="" selected disabled>Selecione</option>

                  <option value="AC">Acre</option>
                  <option value="AL">Alagoas</option>
                  <option value="AP">Amapá</option>
                  <option value="AM">Amazonas</option>
                  <option value="BA">Bahia</option>
                  <option value="CE">Ceará</option>
                  <option value="DF">Distrito Federal</option>
                  <option value="ES">Espírito Santo</option>
                  <option value="GO">Goiás</option>
                  <option value="MA">Maranhão</option>
                  <option value="MT">Mato Grosso</option>
                  <option value="MS">Mato Grosso do Sul</option>
                  <option value="MG">Minas Gerais</option>
                  <option value="PA">Pará</option>
                  <option value="PB">Paraíba</option>
                  <option value="PR">Paraná</option>
                  <option value="PE">Pernambuco</option>
                  <option value="PI">Piauí</option>
                  <option value="RJ">Rio de Janeiro</option>
                  <option value="RN">Rio Grande do Norte</option>
                  <option value="RS">Rio Grande do Sul</option>
                  <option value="RO">Rondônia</option>
                  <option value="RR">Roraima</option>
                  <option value="SC">Santa Catarina</option>
                  <option value="SP">São Paulo</option>
                  <option value="SE">Sergipe</option>
                  <option value="TO">Tocantins</option>
                </select>
              </div>
            </div>
          </fieldset>

          <div class="d-flex gap-3">
            <button type="submit" class="btn btn-success flex-fill py-2">
              Cadastrar Propriedade
            </button>
          </div>
        </form>
      </div>
    </main>
    <footer class="border-top py-3 mt-auto">
      <div class="container text-center">
        <small class="text-muted">
          &copy; 2026 Vinícius Saraiva. Todos os direitos reservados.
        </small>
      </div>
    </footer>
  </body>
</html>
