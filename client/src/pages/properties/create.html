<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Propriedade</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header>
      <a href="../account/control.html">Voltar ao Painel de Controle</a>
      <h1>Cadastrar Propriedade</h1>
    </header>
    <main>
      <form method="post">
        <fieldset>
          <legend>Identificação da Propriedade</legend>

          <label for="name">Nome: *</label>
          <input
            type="text"
            id="name"
            name="name"
            placeholder="Fazenda Santa Rosa"
            required
          />

          <label for="area">Área Total (Hectares) *</label>
          <input
            type="text"
            id="area"
            name="area"
            placeholder="320.5"
            required
          />

          <label for="description">Descrição (opcional)</label>
          <input
            type="text"
            id="description"
            name="description"
            placeholder="Fazenda Principal"
          />
        </fieldset>

        <fieldset>
          <legend>Localização</legend>

          <label for="street">Logradouro: *</label>
          <input
            type="text"
            id="street"
            name="street"
            placeholder="Joaquim Garcia"
            required
          />

          <label for="number">Número:</label>
          <input
            type="number"
            id="number"
            name="number"
            min="1"
            placeholder="230"
          />

          <label for="complement">Complemento:</label>
          <input
            type="text"
            id="complement"
            name="complement"
            placeholder="Perto do IFC"
          />

          <label for="cep">CEP: *</label>
          <input
            type="text"
            id="cep"
            name="cep"
            placeholder="00000-000"
            pattern="[0-9]{5}-[0-9]{3}"
            maxlength="9"
            required
          />

          <label for="city">Cidade: *</label>
          <input
            type="text"
            id="city"
            name="city"
            placeholder="Camboriú"
            required
          />

          <label for="state">Estado: *</label>
          <select id="state" name="state" required>
            <option value="" selected disabled>Selecione</option>

            <option value="AC">Acre</option>
            <option value="AL">Alagoas</option>
            <option value="AP">Amapá</option>
            <option value="AM">Amazonas</option>
            <option value="BA">Bahia</option>
            <option value="CE">Ceará</option>
            <option value="DF">Distrito Federal</option>
            <option value="ES">Espírito Santo</option>
            <option value="GO">Goiás</option>
            <option value="MA">Maranhão</option>
            <option value="MT">Mato Grosso</option>
            <option value="MS">Mato Grosso do Sul</option>
            <option value="MG">Minas Gerais</option>
            <option value="PA">Pará</option>
            <option value="PB">Paraíba</option>
            <option value="PR">Paraná</option>
            <option value="PE">Pernambuco</option>
            <option value="PI">Piauí</option>
            <option value="RJ">Rio de Janeiro</option>
            <option value="RN">Rio Grande do Norte</option>
            <option value="RS">Rio Grande do Sul</option>
            <option value="RO">Rondônia</option>
            <option value="RR">Roraima</option>
            <option value="SC">Santa Catarina</option>
            <option value="SP">São Paulo</option>
            <option value="SE">Sergipe</option>
            <option value="TO">Tocantins</option>
          </select>
        </fieldset>

        <button type="submit">Cadastrar Propriedade</button>
        <button type="reset">Cancelar</button>
      </form>
    </main>
  </body>
</html>
